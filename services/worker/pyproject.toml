[project]
name = "galaxy-health-bridge-worker"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "celery==5.4.0",
  "redis==5.1.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "psycopg2-binary==2.9.10",          # sync driver for Celery tasks
  "pydantic==2.9.2",
  "pydantic-settings==2.14.2",
  "structlog==24.4.0",
  "httpx==0.27.2",
  "pynacl==1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
