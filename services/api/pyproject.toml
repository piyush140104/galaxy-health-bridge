[project]
name = "galaxy-health-bridge-api"
version = "0.1.0"
description = "Galaxy Health Bridge backend API"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.13.3",
  "argon2-cffi==23.1.0",
  "pyjwt[crypto]==2.9.0",
  "pynacl==1.5.0",                # libsodium for E2E envelopes / sealed boxes
  "redis==5.1.1",
  "celery==5.4.0",
  "httpx==0.27.2",
  "structlog==24.4.0",
  "python-multipart==0.0.12",
  "email-validator==2.2.0",
  "slowapi==0.1.9",
  "prometheus-client==0.25.0",
  "orjson==3.10.7",
  "ulid-py==1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "httpx==0.27.2",
  "ruff==0.7.1",
  "mypy==1.13.0",
  "types-redis==4.6.0.20240903",
  "factory-boy==3.3.1",
  "pip-audit==2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","B","UP","S","ASYNC","RUF"]
ignore = ["S101"]               # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105","S106"]    # hard-coded test secrets are fine

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
