name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  wearos-apk:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble debug APK
        working-directory: apps/wearos
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Stage release artifact
        run: |
          mkdir -p artifacts
          cp apps/wearos/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/wearos-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wearos-apk
          path: artifacts/wearos-app-debug.apk

  github-release:
    runs-on: ubuntu-latest
    needs: [wearos-apk]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wearos-apk
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/wearos-app-debug.apk
