name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "12 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-swift:
    name: CodeQL (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        # Install before codeql-action/init: once init runs it injects an
        # x86_64 tracer dylib via DYLD_INSERT_LIBRARIES, which makes brew
        # (a Ruby process) try to relaunch under Rosetta and fail against
        # the ARM /opt/homebrew prefix on macos-15.
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Build for CodeQL
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project GalaxyHealthBridge.xcodeproj \
            -scheme GalaxyHealthBridge \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: github/codeql-action/analyze@v3

  codeql-kotlin:
    name: CodeQL (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build for CodeQL
        working-directory: apps/wearos
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
